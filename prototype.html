/b><div class="scene-number">'+(i===4?'✓':i===3?'16:30':'1.2 km')+'</div><small>'+c.slot+'</small></div></div>'}function storyBlock(){const c=STORY_COPY[lang];return '<section class="story-section" id="bookingStory"><div class="eyebrow">'+c.storyOver+'</div><h2>'+c.storyTitle+'</h2><p>'+c.storySub+'</p><div class="story-tabs" role="group" aria-label="'+c.watch+'">'+c.steps.map((s,i)=>'<button data-story-step="'+i+'" aria-pressed="'+(i===storyStep)+'"><small>0'+(i+1)+'</small>'+s[0]+'</button>').join('')+'</div><div id="storyStage" aria-live="polite"></div><p class="hint">'+c.note+'</p></section>'}function storyRender(){if(!$('#storyStage'))return;const c=STORY_COPY[lang],s=c.steps[storyStep];$('#storyStage').innerHTML='<div class="story-stage story-scene-entrance"><div class="story-stage-copy"><div class="eyebrow">0'+(storyStep+1)+' / 05 · '+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p><div class="story-controls"><button data-story-back '+(storyStep===0?'disabled':'')+'>'+c.previous+'</button><button data-story-next '+(storyStep===4?'disabled':'')+'>'+c.next+'</button><button class="primary" data-action="startSearch">'+c.try+'</button></div></div>'+storyScene(storyStep)+'</div>';document.querySelectorAll('[data-story-step]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.storyStep)===storyStep));}function previousHome(){const c=STORY_COPY[lang];return '<section class="story-hero"><div class="story-hero-copy"><div class="eyebrow">'+c.over+'</div><h1 lang="'+lang+'">'+c.slogan+'</h1><span class="slogan-pair" lang="'+(lang==='ar'?'en':'ar')+'">'+c.english+'</span><h3>'+c.lead+'</h3><p>'+c.body+'</p><div class="story-hero-actions"><button class="primary" data-action="startSearch">'+c.search+'</button><button class="ghost" data-action="showStory">'+c.watch+'</button></div></div><div class="hero-3d">'+storyScene(2,true)+'</div></section>'+searchBox()+storyBlock()+'<section class="section"><div class="section-top"><div><h2>'+t('services')+'</h2><p>'+t('servicesSu function filtered(){let a=doctors.filter(d=>(filters.specialty==='all'||d.spec===filters.specialty)&&(filters.area==='all'||d.area===filters.area)&&(filters.max==='all'||d.fee<=Number(filters.max))&&(filters.date==='any'||d.first<=['today','tomorrow','after'].indexOf(filters.date)));return a.sort((a,b)=>filters.sort==='nearest'?a.km-b.km:filters.sort==='price'?a.fee-b.fee:a.first-b.first||a.km-b.km);}
function card(d){const preview=filters.date==='any'?d.first:Math.max(d.first,['today','tomorrow','after'].indexOf(filters.date));return `<article class="doctor-card"><div class="doctor-card-top"><div class="portrait">${avatar(d)}</div><div><h3>${n(d)}</h3><p>${t('consultant')} · ${t(d.spec)}</p><div class="photo-label">${t('stock')} · ${t('sample')}</div></div></div><div class="card-details"><div><small>${t('location')}</small><b>${areaName(d.area)}</b><small>${d.km} ${lang==='ar'?'كم — مسافة توضيحية':'km — illustrative distance'}</small></div><div><small>${t('fee')}</small><b>${money(d.fee)}</b><small>${t('fixed')}</small></div></div><div class="slot-preview"><span>${t('next')}</span><b>${dayName(preview)} · ${times(preview)[0]}</b></div><small class="quick-intro">${t('slotDirect')}</small><div class="quick-slots">${times(preview).slice(0,2).map(slot=>`<button data-quick-doctor="${d.id}" data-quick-day="${preview}" data-quick-time="${slot}" aria-label="${t('quickBook')} · ${n(d)} · ${dayName(preview)} · ${slot}">${slot}</button>`).join('')}</div><button class="profile-link" data-doctor="${d.id}">${t('profile')}</button></article>`;}
function results(){const ds=filtered();return `${progress(0)}<div class="page-title"><h2>${t('results')}</h2><p>${t('resultsSub')}</p></div>${searchBox()}<div class="results-layout"><aside class="filter-panel"><h3>${t('filter')}</h3><label>${t('priceLimit')}<select id="maxFee">${['all','500','600','800'].map(v=>`<option value="${v}" ${filters.max===v?'selected':''}>${v==='all'?t('anyPrice'):money(Number(v))}</option>`).join('')}</select></label><div class="note">${t('fixed')}</div></aside><section><div class="result-toolbar"><span>${ds.length} ${t('options')}</span><select id="sort" aria-label="${t('sort')}">${['earliest','nearest','price'].map(k=>`<option value="${k}" ${filters.sort===k?'selected':''}>${t(k)}</option>`).join('')}</select></div>${ds.length?`<div class="doctor-grid">${ds.map(card).join('')}</div>`:`<div class="empty"><h3>${t('empty')}</h3><p>${t('emptyText')}</p><button data-action="clear">${t('clearFilters')}</button></div>`}</section></div>`;}
function profile(){const d=doctor();if(day<d.first)day=d.first;return `${progress(1)}<button class="back" data-action="results">${t('back')}</button><div class="profile-layout"><div><section class="panel"><div class="profile-top"><div class="portrait">${avatar(d)}</div><div><small>${t('sample')}</small><h1>${n(d)}</h1><p>${t('consultant')} · ${t(d.spec)}</p><div class="stats"><span class="pill">${areaName(d.area)}</span><span class="pill">${t('stock')} · ${t('sample')}</span></div></div></div></section><section class="panel"><h3>${t('about')}</h3><p>${t('profileAbout')}</p><ul class="details-list"><li>${t('credentials')} · ${t(d.spec)}</li><li>${t('location')}: ${areaName(d.area)} · ${lang==='ar'?'مركز طبي توضيحي':'Illustrative medical centre'}</li></ul></section><section class="panel"><h3>${t('clinic')}</h3><p>${t('access')}</p><div class="note">${t('included')}</div><h3>${t('review')}</h3><p>${t('reviewText')}</p></section></div><aside class="panel sticky"><h3>${t('choose')}</h3><div class="summary-row"><small>${t('fee')}</small><b>${money(d.fee)}</b></div><small>${t('daysLabel')}</small><div class="calendar">${[0,1,2].map(i=>`<button data-day="${i}" ${i<d.first?'disabled':''} class="${day===i?'selected':''}" aria-pressed="${day===i}">${dayName(i)}</button>`).join('')}</div><div class="slots">${times(day).map(s=>`<button data-time="${s}" class="${time===s?'selected':''}" aria-pressed="${time===s}">${s}</button>`).join('')}</div><div class="note">${t('fixed')}</div><button class="primary" style="width:100%" data-action="review" ${!time?'disabled':''}>${t('continue')}</button>${!time?`<p class="error">${t('selectTime')}</p>`:''}</aside></div>`;}
function summary(d){return `<div class="doctor-card-top"><div class="portrait">${avatar(d)}</div><div><h3>${n(d)}</h3><p>${t(d.spec)}</p><small>${t('sample')}</small></div></div><div class="summary-row"><small>${t('location')}</small><b>${areaName(d.area)}</b></div><div class="summary-row"><small>${t('appointment')}</small><b>${dayName(day)} · <bdi>${time}</bdi></b></div><div class="summary-row"><small>${t('fee')}</small><b>${money(d.fee)}</b></div><div class="summary-row"><small>${t('extra')}</small><b>${money(0)}</b></div><div class="summary-row total"><span>${t('total')}</span><span>${money(d.fee)}</span></div>`;}
function booking(){const d=doctor();return `${progress(2)}<div class="page-title"><h2>${t('bookingTitle')}</h2><p>${t('bookingSub')}</p></div><div class="booking-layout"><form id="bookingForm"><section class="panel"><h3>${t('who')}</h3><div class="booking-as"><button type="button" data-for="self" class="${bookingFor==='self'?'selected':''}">${t('self')}</button><button type="button" data-for="family" class="${bookingFor==='family'?'selected':''}">${t('family')}</button></div><div class="field-grid"><label>${t('name')}<input id="demoName" value="${t(bookingFor==='self'?'demoName':'demoFamily')}" autocomplete="off" maxlength="60" required></label><label>${t('contact')}<input id="demoContact" value="01000000000" autocomplete="off" inputmode="tel" maxlength="15" required></label></div><div class="note">${t('bookingSub')}</div></section><section class="panel"><h3>${t('paymentTitle')}</h3>${['app','clinic'].map(v=>`<label class="payment-option"><input type="radio" name="payment" value="${v}" ${payment===v?'checked':''}><span><b>${t(v==='app'?'appPay':'clinicPay')}</b><small>${t(v==='app'?'appPayDesc':'clinicPayDesc')}</small></span></label>`).join('')}<div class="note">${t('policy')}</div><label class="consent"><input type="checkbox" id="consent" required><span>${t('agree')}</span></label><p id="bookingError" class="error" role="alert"></p><button class="primary" style="width:100%;margin-top:22px" type="submit">${t('confirm')}</button></section></form><aside class="panel sticky"><h3>${t('summary')}</h3>${summary(d)}<button class="quiet" style="width:100%;margin-top:20px" data-action="profile">${t('change')}</button></aside></div>`;}
function confirmation(){const d=doctor();return `${progress(3)}<div class="confirmation"><div class="confirm-head"><div class="check-circle">${confirmed.cancelled?'–':'✓'}</div><h2>${confirmed.cancelled?t('cancelled'):t('confirmedTitle')}</h2><p>${t('confirmedSub')}</p></div><section class="panel"><div class="summary-row"><small>${t('ref')}</small><bdi>CD-DEMO-014</bdi></div>${summary(d)}<div class="summary-row"><small>${t('who')}</small><b>${t(confirmed.bookingFor==='family'?'family':'self')}</b></div><div class="status-line ${confirmed.cancelled?'cancelled':''}"><span class="status-dot"></span><span>${t('status')}: <b>${t(confirmed.cancelled?'cancelled':'confirmedStatus')}</b></span></div><small>${t(confirmed.payment==='app'?'paid':'payClinicStatus')}</small><div class="note"><b>${t('nextStep')}</b><p>${t('nextStepText')}</p></div><div class="confirm-actions">${!confirmed.cancelled?`<button data-action="reschedule">${t('change')}</button><button data-action="cancel">${t('cancel')}</button>`:''}<button data-action="help">${t('help')}</button><button class="primary" data-action="results">${t('newSearch')}</button></div></section></div>`;}

const CARE_COPY={ar:[['01 · البداية','أقرب للرعاية.','Closer to care.','لما الحجز يبقى لحد بتحبّه، التفاصيل بتفرق. بدل ما يومك يضيع في مكالمات و«مفيش ميعاد»، ابدأ من مكان واحد.','شوف إزاي'],['02 · المكان','الدكتور اللي محتاجه. أقرب ليك.','','اختار التخصص والمنطقة. شوف الاختيارات القريبة، وقارن المسافة والمواعيد المتاحة قدّامك.','شوف التفاصيل'],['03 · الاختيار','كل اللي يهمّك. قبل ما تختار.','','التخصص، مكان العيادة، وسعر الكشف. تفاصيل واضحة تساعدك تختار المناسب ليك وللي يهمّوك.','اختار الميعاد'],['04 · الميعاد','ميعاد يناسب يومك.','','شوف الأيام والساعات المتاحة. اختار اللي يناسبك، وراجع تفاصيل الحجز وطريقة الدفع قبل التأكيد.','كمّل الرحلة'],['05 · التأكيد','حجزك واضح. وخطوتك الجاية أوضح.','','المكان، الميعاد، وحالة الحجز في مكان واحد. ولو احتجت تغيّر حاجة، المساعدة تبقى سهلة الوصول.','جرّب الحجز']],en:[['01 · THE START','Closer to care.','أقرب للرعاية.','When you’re booking for someone you love, the details matter. Start in one place, instead of spending your day calling around.','Explore the journey'],['02 · YOUR AREA','The care you need. Closer to you.','','Choose a specialty and area. See nearby options with location and available appointments together.','See the details'],['03 · YOUR CHOICE','The details. Before the decision.','','Specialty, clinic location and consultation fee. A clearer choice for the people who matter.','Find your time'],['04 · YOUR TIME','An appointment that fits your day.','','Explore available days and times. Choose your appointment and review the booking and payment details.','See what comes next'],['05 · ALL SET','Your booking. Your next step.','','Location, time and booking status together. With an easy way to find help when you need to make a change.','Try the booking flow']]};
let careObserver;
function home(){return '<section class="care-story"><div class="care-world"><div id="careCanvas" aria-hidden="true"></div><div class="scene-fallback" aria-hidden="true">♡</div></div><div class="care-demo">'+t('demo')+'</div>'+CARE_COPY[lang].map((s,i)=>'<section class="care-chapter" id="careChapter'+i+'" data-care-chapter="'+i+'"><div class="care-panel"><div class="eyebrow">'+s[0]+'</div><'+(i===0?'h1':'h2')+' lang="'+lang+'">'+s[1]+'</'+(i===0?'h1':'h2')+'>'+(s[2]?'<span class="care-pair" lang="'+(lang==='ar'?'en':'ar')+'">'+s[2]+'</span>':'')+'<p>'+s[3]+'</p><button class="care-next" '+(i<4?'data-care-go="'+(i+1)+'"':'data-action="startSearch"')+'>'+s[4]+'<span aria-hidden="true">'+(lang==='ar'?'←':'→')+'</span></button></div></section>').join('')+'</section><div class="care-dock"><div class="care-dots" aria-label="'+(lang==='ar'?'خطوات الرحلة':'Journey chapters')+'">'+CARE_COPY[lang].map((s,i)=>'<button data-care-go="'+i+'" aria-label="'+s[0]+'" aria-current="'+(i===0)+'"></button>').join('')+'</div><span class="care-counter" id="careCounter">01 / 05</span><button class="care-book" data-action="startSearch">'+t('find')+' ↗</button></div><div class="care-search-area"><h2>'+t('searchTitle')+'</h2><p>'+t('sub')+'</p>'+searchBox()+'<section class="section"><div class="section-top"><h2>'+t('services')+'</h2></div><div class="service-grid">'+['skin','children','dental'].map((s,i)=>'<button class="service-tile" data-service="'+s+'"><span class="tile-icon">'+['✧','♡','◇'][i]+'</span><span><b>'+t(s)+'</b><small>'+t('serviceDesc')+'</small></span></button>').join('')+'</div></section><section class="partner-strip"><div><h3>'+t('partnerHeadline')+'</h3><p>'+t('partnerSub')+'</p></div><button data-action="partners">'+t('partnerCTA')+'</button></section></div>';}
function careMount(){careObserver?.disconnect();window.stopImmersiveHome?.();document.body.classList.toggle('immersive',stage==='home');if(stage!=='home')return;window.initImmersiveHome?.();careObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const index=Number(entry.target.dataset.careChapter);window.dispatchEvent(new CustomEvent('care-scene',{detail:{index}}));document.querySelectorAll('[data-care-go]').forEach(b=>{if(b.parentElement.classList.contains('care-dots'))b.setAttribute('aria-current',String(Number(b.dataset.careGo)===index))});$('#careCounter').textContent='0'+(index+1)+' / 05';}},{threshold:.55});document.querySelectorAll('[data-care-chapter]').forEach(el=>careObserver.observe(el));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-care-go]');if(b)document.querySelector('#careChapter'+b.dataset.careGo)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});

function navigate(s){location.hash=s;}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title='CasaDoctors · '+(lang==='ar'?'نموذج الموقع التفاعلي':'Interactive website prototype');$('.official-logo').src=imageAsset('logo');$('#demoBar').innerHTML=`<span>${t('demo')}</span><a href="./#s11">${t('plan')}</a>`;$('#nav').innerHTML=`<button data-action="results">${t('find')}</button><button data-action="bookings">${t('bookings')}</button><button data-action="help">${t('help')}</button>`;$('#headerActions').innerHTML=`<button class="partner-btn" data-action="partners">${t('partners')}</button><button class="mobile-bookings" data-action="bookings">${t('bookings')}</button><button class="app-download" data-action="app">${t('download')}</button><button data-action="language" aria-label="${t('language')}">${t('language')}</button>`;$('#footer').innerHTML=`<span>${t('foot')}<br><small>${t('imagesCredit')}</small></span><button class="quiet" data-action="bookings">${t('bookings')}</button><button class="quiet" data-action="app">${t('download')}</button><button class="quiet" data-action="reset">${t('reset')}</button><a href="./#s11">${t('plan')}</a>`;$('#helpFloat').textContent=t('help');$('#app').innerHTML=`<div class="fade">${stage==='home'?home():stage==='results'?results():stage==='doctor'?profile():stage==='booking'?booking():confirmation()}</div>`;careMount();}
function route(){const hash=location.hash.slice(1)||'home',parts=hash.split('/');if(parts[0]==='doctor'){chosen=Number(parts[1]);if(!doctors.some(d=>d.id===chosen))chosen=1;stage='doctor';}else if(parts[0]==='booking'&&time)stage='booking';else if(parts[0]==='confirmation'&&confirmed)stage='confirmation';else stage=['home','results'].includes(parts[0])?parts[0]:'home';render();window.scrollTo(0,0);}
let modalReturnFocus=null;function appPlatform(ua=navigator.userAgent,touch=navigator.maxTouchPoints){return /Android/i.test(ua)?'android':/iPhone|iPad|iPod/i.test(ua)||/Macintosh/i.test(ua)&&touch>1?'ios':'desktop'}function appModal(){popupDismissed=true;modalReturnFocus=document.activeElement;const platform=appPlatform(),link=(key,label)=>'<a class="store-link" href="'+APP_STORES[key]+'" target="_blank" rel="noopener">'+label+' ↗</a>';$('#modalRoot').innerHTML='<div class="modal-backdrop"><section class="modal app-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="app-modal-close" data-action="close" aria-label="'+t('close')+'">×</button><img class="app-modal-icon" src="'+imageAsset('appIcon')+'" alt="CasaDoctors"><small>CASADOCTORS</small><h2 id="modalTitle">'+t('appTitle')+'</h2><p>'+t('appBody')+'</p><div class="store-links">'+(platform==='desktop'?link('android','Google Play')+link('ios','App Store'):link(platform,t('download')+' · '+(platform==='android'?'Google Play':'App Store')))+'</div><button class="quiet app-later" data-action="close">'+t('later')+'</button><small class="app-modal-note">'+t('appNote')+'</small></section></div>';$('#modalRoot button').focus();try{sessionStorage.setItem('casa-app-popup-shown','1')}catch(e){}}
function modal(type){modalReturnFocus=document.activeElement;let title=type==='cancel'?t('cancelTitle'):t(type==='partners'?'partnerTitle':'helpTitle'),text=type==='cancel'?t('cancelText'):t(type==='partners'?'partnerText':'helpText');$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">${title}</h3><button data-action="close" aria-label="${t('close')}">×</button></div><p>${text}</p>${type==='cancel'?`<button class="primary" data-action="cancelYes">${t('cancelYes')}</button> <button data-action="close">${t('keep')}</button>`:`<button class="primary" data-action="close">${t('close')}</button>`}</section></div>`;$('#modalRoot button').focus();}
function closeModal(){$('#modalRoot').innerHTML='';if(modalReturnFocus?.isConnected)modalReturnFocus.focus();else $('#helpFloat').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.quickDoctor){chosen=Number(b.dataset.quickDoctor);day=Number(b.dataset.quickDay);time=b.dataset.quickTime;navigate('booking/'+chosen);}else if(b.dataset.doctor){chosen=Number(b.dataset.doctor);day=filters.date==='any'?doctor().first:Math.max(doctor().first,['today','tomorrow','after'].indexOf(filters.date));time='';navigate('doctor/'+chosen);}else if(b.dataset.service){filters.specialty=b.dataset.service;navigate('results');}else if(b.dataset.day){day=Number(b.dataset.day);time='';render();}else if(b.dataset.time){time=b.dataset.time;render();}else if(b.dataset.for){bookingFor=b.dataset.for;render();}else{const a=b.dataset.action;if(a==='app')appModal();if(a==='language'){lang=lang==='ar'?'en':'ar';render();}if(a==='results')navigate('results');if(a==='profile')navigate('doctor/'+chosen);if(a==='review'&&time)navigate('booking/'+chosen);if(a==='help'||a==='partners'||a==='cancel')modal(a);if(a==='close')closeModal();if(a==='cancelYes'){confirmed.cancelled=true;closeModal();render();}if(a==='reschedule'){chosen=confirmed.doctorId;day=confirmed.day;confirmed=null;time='';navigate('doctor/'+chosen);}if(a==='clear'){filters={specialty:'all',area:'all',date:'any',max:'all',sort:'earliest'};render();}if(a==='reset'){filters={specialty:'all',area:'all',date:'any',max:'all',sort:'earliest'};confirmed=null;chosen=1;day=0;time='';bookingFor='self';payment='app';if(stage==='home')render();else navigate('home');}if(a==='bookings'){if(confirmed){chosen=confirmed.doctorId;day=confirmed.day;time=confirmed.time;bookingFor=confirmed.bookingFor;navigate('confirmation');}else{$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">${t('noBookings')}</h3><button data-action="close">×</button></div><p>${t('noBookingsText')}</p><button class="primary" data-action="close">${t('close')}</button></section></div>`;$('#modalRoot button').focus();}}}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();filters.specialty=$('#specialty').value;filters.area=$('#area').value;filters.date=$('#date').value;if(stage==='results')render();else navigate('results');}if(e.target.id==='bookingForm'){e.preventDefault();if(!$('#consent').checked){$('#bookingError').textContent=t('consentError');return;}payment=$('input[name="payment"]:checked').value;confirmed={payment,cancelled:false,doctorId:chosen,day,time,bookingFor};$('#demoName').value='';$('#demoContact').value='';navigate('confirmation');}});
document.addEventListener('change',e=>{if(e.target.id==='maxFee'){filters.max=e.target.value;render();}if(e.target.id==='sort'){filters.sort=e.target.value;render();}if(e.target.name==='payment')payment=e.target.value;});
document.addEventListener('keydown',e=>{if(!$('#modalRoot').firstChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const bs=[...$('#modalRoot').querySelectorAll('button,a[href]')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}});
window.addEventListener('hashchange',route);route();let popupDismissed=false;try{popupDismissed=sessionStorage.getItem('casa-app-popup-shown')==='1'}catch(e){}function scheduleAppPopup(){setTimeout(()=>{if(popupDismissed)return;if(stage!=='home'||$('#modalRoot').firstChild||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){scheduleAppPopup();return;}popupDismissed=true;appModal();},8000)}if(!popupDismissed)scheduleAppPopup();
</script><script type="module" src="immersive-home.js?v=2"></script></body></html>
