function avatar(d){return '<img src="'+imageAsset('doctor'+d.id)+'" alt="'+E(t('stockPortrait'))+'" loading="lazy" width="110" height="130">';}
function heroArt(){return '<img class="family-photo" src="'+imageAsset('family')+'" alt="'+E(t('familyPhoto'))+'" fetchpriority="high" width="1000" height="667">';}
let pickerMonth;
function calendarDateLabel(value){return value?new Intl.DateTimeFormat(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(value+'T12:00:00')):t('any');}
function closeSearchCalendar(){const pop=$('#searchDateCalendar');if(pop)pop.hidden=true;$('#dateTrigger')?.setAttribute('aria-expanded','false');}
function drawSearchCalendar(){const pop=$('#searchDateCalendar');if(!pop)return;const month=pickerMonth,year=month.getFullYear(),m=month.getMonth(),first=new Date(year,m,1).getDay(),count=new Date(year,m+1,0).getDate(),min=localSearchDate(),value=$('#date').value;const weekdays=lang==='ar'?['ح','ن','ث','ر','خ','ج','س']:['Su','Mo','Tu','We','Th','Fr','Sa'];pop.innerHTML=`<div class="date-calendar-head"><button type="button" data-picker-month="-1" aria-label="${lang==='ar'?'الشهر اللي قبل':'Previous month'}">‹</button><b>${new Intl.DateTimeFormat(lang==='ar'?'ar-EG':'en-GB',{month:'long',year:'numeric'}).format(month)}</b><button type="button" data-picker-month="1" aria-label="${lang==='ar'?'الشهر اللي بعد':'Next month'}">›</button></div><div class="date-calendar-grid">${weekdays.map(s=>'<small>'+s+'</small>').join('')}${'<span></span>'.repeat(first)}${Array.from({length:count},(_,i)=>{const day=i+1,iso=year+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');return '<button type="button" data-picker-date="'+iso+'" '+(iso<min?'disabled':'')+' aria-label="'+calendarDateLabel(iso)+'" aria-pressed="'+(value===iso)+'" class="'+(value===iso?'selected':'')+' '+(iso===min?'picker-today':'')+'">'+day+'</button>';}).join('')}</div><div class="date-calendar-shortcuts"><button type="button" data-picker-date="${localSearchDate()}">${t('today')}</button><button type="button" data-picker-date="${localSearchDate(1)}">${t('tomorrow')}</button><button type="button" data-picker-clear>${t('any')}</button></div>`;}
function openSearchCalendar(){const pop=$('#searchDateCalendar');if(!pop)return;pickerMonth=new Date(($('#date').value||localSearchDate())+'T12:00:00');pickerMonth.setDate(1);drawSearchCalendar();pop.hidden=false;$('#dateTrigger').setAttribute('aria-expanded','true');pop.querySelector('[data-picker-date]:not([disabled])')?.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.id==='dateTrigger'){if($('#searchDateCalendar').hidden)openSearchCalendar();else closeSearchCalendar();return;}if(b?.dataset.pickerMonth){pickerMonth.setMonth(pickerMonth.getMonth()+Number(b.dataset.pickerMonth));drawSearchCalendar();return;}if(b?.dataset.pickerDate||b?.hasAttribute('data-picker-clear')){$('#date').value=b.dataset.pickerDate||'';$('#dateValue').textContent=calendarDateLabel($('#date').value);closeSearchCalendar();$('#dateTrigger').focus();return;}if(!e.target.closest('.date-field'))closeSearchCalendar();});
document.addEventListener('keydown',e=>{const pop=$('#searchDateCalendar');if(!pop||pop.hidden)return;if(e.key==='Escape'){e.preventDefault();closeSearchCalendar();$('#dateTrigger').focus();}});

function localSearchDate(offset=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function searchDateOffset(){if(filters.date==='any')return null;const legacy=['today','tomorrow','after'].indexOf(filters.date);if(legacy>=0)return legacy;const selected=new Date(filters.date+'T12:00:00'),today=new Date(localSearchDate()+'T12:00:00');return Math.round((selected-today)/86400000);}
function searchDateValue(){return filters.date==='any'?'':/^\d{4}-\d{2}-\d{2}$/.test(filters.date)?filters.date:localSearchDate(searchDateOffset());}
function searchBox(){return `<form id="searchForm" class="search-box"><div class="search-title"><b>${t('searchTitle')}</b><small>${t('sample')}</small></div><div class="search-grid"><label>${t('specialty')}<select id="specialty"><option value="all">${t('allSpecialties')}</option>${['skin','children','dental'].map(s=>`<option value="${s}" ${filters.specialty===s?'selected':''}>${t(s)}</option>`).join('')}</select></label><label>${t('area')}<select id="area"><option value="all">${t('allAreas')}</option>${['fifth','rehab'].map(a=>`<option value="${a}" ${filters.area===a?'selected':''}>${areaName(a)}</option>`).join('')}</select></label><div class="date-field"><label id="dateLabel">${t('date')}</label><input type="hidden" id="date" value="${searchDateValue()}"><button id="dateTrigger" type="button" aria-labelledby="dateLabel dateValue" aria-expanded="false" aria-controls="searchDateCalendar"><span id="dateValue">${calendarDateLabel(searchDateValue())}</span><span aria-hidden="true">▦</span></button><div id="searchDateCalendar" class="date-calendar" role="group" aria-label="${lang==='ar'?'اختار تاريخ الحجز':'Choose an appointment date'}" hidden></div></div><button class="primary" type="submit">${t('search')}</button></div></form>`;}
function progress(i){return `<div class="progress" aria-label="${lang==='ar'?'خطوات التجربة':'Journey progress'}">${[t('find'),t('profile'),t('summary'),t('confirmedStatus')].map((s,j)=>`<span ${i===j?'class="active" aria-current="step"':''}>${j+1} · ${s}</span>${j<3?'<i>·</i>':''}`).join('')}</div>`;}

function homeDoctor(){return doctors.find(d=>d.area===homeArea&&d.spec==='skin')||doctors[0];}
function nearbyPreview(){const d=homeDoctor(),c=HOME_COPY[lang];return `<section class="nearby-preview" aria-label="${c.area}"><div class="preview-top"><span class="preview-dot"></span><small>${c.area}</small><span class="example-tag">${t('sample')}</span></div><div class="mini-doctor"><div class="portrait">${avatar(d)}</div><div><b>${n(d)}</b><small>${t(d.spec)} · ${areaName(d.area)}</small></div></div><div class="mini-facts"><span>${d.km} ${lang==='ar'?'كم':'km'}<small>${c.near}</small></span><span>${money(d.fee)}<small>${c.fee}</small></span></div><div class="preview-bottom"><span>${dayName(d.first)} · <bdi>${times(d.first)[0]}</bdi></span><button data-doctor="${d.id}">${c.view} ↗</button></div></section>`;}
function doctorDetailPreview(){const d=homeDoctor(),c=HOME_COPY[lang];return `<section class="journey-widget doctor-detail-preview"><small class="example-tag">${c.example}</small><div class="mini-doctor"><div class="portrait">${avatar(d)}</div><div><b>${n(d)}</b><small>${t('consultant')} · ${t(d.spec)}</small></div></div><div class="summary-row"><small>${t('specialty')}</small><b>${t(d.spec)}</b></div><div class="summary-row"><small>${t('location')}</small><b>${areaName(d.area)}</b></div><div class="summary-row"><small>${c.fee}</small><b>${money(d.fee)}</b></div><p style="font-size:10px;margin:10px 0">${lang==='ar'?'التخصص، العيادة، وسعر الكشف. تفاصيل تساعدك تقرر قبل ما تختار الميعاد.':'Specialty, clinic and consultation fee. The details that help you decide before choosing a time.'}</p><button class="primary widget-action" data-doctor="${d.id}">${lang==='ar'?'افتح ملف الدكتور والمواعيد':'Explore profile & appointments'} ↗</button></section>`;}
function journeyCard(){const d=homeDoctor(),c=HOME_COPY[lang];if(journeyStep===0)return doctorDetailPreview();if(journeyStep===1)return `<section class="journey-widget"><small class="example-tag">${c.example}</small><div class="mini-doctor"><div class="portrait">${avatar(d)}</div><div><b>${n(d)}</b><small>${areaName(d.area)} · ${money(d.fee)}</small></div></div><b class="widget-day">${dayName(d.first)}</b><div class="preview-times">${times(d.first).slice(0,3).map(s=>`<button data-home-slot="${s}" aria-pressed="${homeSlot===s}" class="${homeSlot===s?'selected':''}">${s}</button>`).join('')}</div><button class="primary widget-action" data-quick-doctor="${d.id}" data-quick-day="${d.first}" data-quick-time="${homeSlot}">${c.book}</button></section>`;return `<section class="journey-widget confirmation-widget"><small class="example-tag">${c.example}</small><div class="mini-confirm">✓</div><h3>${c.confirmation}</h3><p>${c.details}</p><div class="summary-row"><small>${lang==='ar'?'الدكتور':'Doctor'}</small><b>${n(d)}</b></div><div class="summary-row"><small>${t('appointment')}</small><b>${dayName(d.first)} · <bdi>${homeSlot}</bdi></b></div><div class="summary-row"><small>${c.fee}</small><b>${money(d.fee)}</b></div><div class="preview-status">● ${c.status}</div><button class="primary widget-action" data-home-family="true" data-quick-doctor="${d.id}" data-quick-day="${d.first}" data-quick-time="${homeSlot}">${c.review}</button><button class="widget-help" data-action="help">${c.support}</button></section>`;}
function home(){const c=HOME_COPY[lang];return `<div class="booking-home"><section class="booking-hero"><div class="booking-hero-copy"><div class="eyebrow">CASADOCTORS · ${lang==='ar'?'اختيار أوضح، للي يهمّوك.':'A clearer choice for the people who matter.'}</div><h1>${c.slogan}</h1><span class="hero-slogan-pair" lang="${lang==='ar'?'en':'ar'}">${c.pair}</span><h2>${c.lead}</h2><p>${c.body}</p></div><div class="booking-hero-art"><div id="careCanvas" data-scene-index="1"></div><span class="map-beacon" aria-hidden="true"></span><div class="hero-area-toggle" aria-label="${c.areaSelect}">${['fifth','rehab'].map(a=>`<button data-home-area="${a}" aria-pressed="${homeArea===a}">${areaName(a)}</button>`).join('')}</div><div id="heroPreview">${nearbyPreview()}</div></div><div class="hero-search">${searchBox()}<p class="booking-demo-note">${t('demo')}</p></div></section><section class="booking-reassurance">${c.reassure.map((s,i)=>`<div><span class="reassurance-icon" aria-hidden="true">${careIcon(['fees','review','support'][i])}</span><div><b>${s}</b><p>${c.reassureBody[i]}</p></div></div>`).join('')}</section><section class="compact-journey" id="bookingJourney"><div class="journey-heading"><div class="eyebrow">${lang==='ar'?'حجز أسهل، خطوة بخطوة.':'AN EASIER BOOKING, STEP BY STEP.'}</div><h2>${c.how}</h2><p>${c.howBody}</p></div><div class="journey-tabs" role="tablist" aria-label="${c.how}">${c.steps.map((s,i)=>`<button role="tab" id="journeyTab${i}" aria-controls="journeyPanel" aria-selected="${journeyStep===i}" tabindex="${journeyStep===i?0:-1}" data-journey-step="${i}"><span>0${i+1}</span>${s}</button>`).join('')}</div><div class="compact-journey-body" id="journeyPanel" role="tabpanel" aria-labelledby="journeyTab${journeyStep}"><div class="journey-art"><div id="journeyCanvas" data-scene-index="${journeyScenes[journeyStep]}"></div><div id="journeyWidget">${journeyCard()}</div></div><div class="journey-explanation"><small class="journey-number" id="journeyNumber">0${journeyStep+1} / 03</small><h3 id="journeyTitle">${c.titles[journeyStep]}</h3><p id="journeyDescription">${c.descriptions[journeyStep]}</p><div class="journey-flow" aria-hidden="true">${c.steps.map((s,i)=>`<span class="${i===journeyStep?'active':''}">${s}</span>`).join('<i>›</i>')}</div><div class="journey-controls"><button data-journey-prev ${journeyStep===0?'disabled':''}>${c.back}</button>${journeyStep<2?`<button class="primary" data-journey-next>${c.next} ${lang==='ar'?'←':'→'}</button>`:`<button class="primary" data-action="startSearch">${c.ready} ↗</button>`}</div></div></div></section><section class="section home-services"><div class="section-top"><h2>${t('services')}</h2></div><div class="service-grid">${['skin','children','dental'].map((s,i)=>`<button class="service-tile" data-service="${s}"><span class="tile-icon">${careIcon(['skin','children','dental'][i])}</span><span><b>${t(s)}</b><small>${t('serviceDesc')}</small></span></button>`).join('')}</div></section><section class="home-support"><div class="support-symbol" aria-hidden="true">${careIcon('support')}</div><div><h2>${c.support}</h2><p>${c.supportBody}</p><small>${c.example}</small></div><button data-action="help">${c.supportCTA} ↗</button></section><section class="partner-strip"><div><h3>${t('partnerHeadline')}</h3><p>${t('partnerSub')}</p></div><button data-action="partners">${t('partnerCTA')}</button></section></div>`;}
function updateJourney(){const c=HOME_COPY[lang];document.querySelectorAll('[data-journey-step]').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===journeyStep));b.tabIndex=i===journeyStep?0:-1;});$('#journeyPanel').setAttribute('aria-labelledby','journeyTab'+journeyStep);$('#journeyNumber').textContent='0'+(journeyStep+1)+' / 03';$('#journeyTitle').textContent=c.titles[journeyStep];$('#journeyDescription').textContent=c.descriptions[journeyStep];$('#journeyWidget').innerHTML=journeyCard();$('.journey-flow').innerHTML=c.steps.map((s,i)=>'<span class="'+(i===journeyStep?'active':'')+'">'+s+'</span>').join('<i>›</i>');$('.journey-controls').innerHTML='<button data-journey-prev '+(journeyStep===0?'disabled':'')+'>'+c.back+'</button>'+(journeyStep<2?'<button class="primary" data-journey-next>'+c.next+' '+(lang==='ar'?'←':'→')+'</button>':'<button class="primary" data-action="startSearch">'+c.ready+' ↗</button>');window.dispatchEvent(new CustomEvent('care-scene',{detail:{index:journeyScenes[journeyStep]}}));}
function careMount(){window.stopImmersiveHome?.();document.body.classList.toggle('immersive',stage==='home');if(stage==='home')window.initImmersiveHome?.();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.homeFamily)bookingFor='family';if(b.dataset.journeyStep!==undefined){journeyStep=Number(b.dataset.journeyStep);updateJourney();}if(b.hasAttribute('data-journey-next')){journeyStep=Math.min(2,journeyStep+1);updateJourney();}if(b.hasAttribute('data-journey-prev')){journeyStep=Math.max(0,journeyStep-1);updateJourney();}if(b.dataset.homeSlot){homeSlot=b.dataset.homeSlot;updateJourney();}if(b.dataset.homeArea){homeArea=b.dataset.homeArea;filters.area=homeArea;homeSlot=times(homeDoctor().first)[0];$('#area').value=homeArea;$('#heroPreview').innerHTML=nearbyPreview();document.querySelectorAll('[data-home-area]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.homeArea===homeArea)));updateJourney();$('.map-beacon').classList.remove('beacon-selected');requestAnimationFrame(()=>$('.map-beacon')?.classList.add('beacon-selected'));}});

const careHistory=[];
const sl=k=>SERVICE_LABELS[lang][k];
let careMode='video',careStep=0,careChoice={area:'fifth',day:0,time:'16:30',who:'self'},careCart=[0,0,0],demoRoom=false,demoMic=false,demoCamera=false;
const serviceIcons=Object.fromEntries(['clinic','video','home','pharmacy','wallet','premium'].map(k=>[k,careIcon(k)]));
function serviceGateway(){return `<section class="service-gateway"><div><h2>${sl('choose')}</h2><p>${sl('intro')}</p></div><div class="care-mode-grid">${['clinic','video','home','pharmacy'].map(mode=>`<button data-care-mode="${mode}"><span class="care-mode-icon" aria-hidden="true">${serviceIcons[mode]}</span><b>${sl(mode)}</b><small>${lang==='ar'?'شوف التفاصيل والاختيارات':'Explore details & options'} ↗</small></button>`).join('')}</div></section>`;}
const clinicHome=home;
home=function(){return clinicHome().replace('<div class="booking-home">','<div class="booking-home">'+serviceGateway()).replace('<section class="partner-strip">',`<section class="app-features"><h2>${lang==='ar'?'كمّل رعايتك على التطبيق.':'Keep your care together in the app.'}</h2><p>${lang==='ar'?'الحجوزات، متابعة الدفع، والمساعدة. اعرف كمان عن المحفظة والخدمات المميزة.':'Bookings, payment status and help. Explore the wallet and premium-service information too.'}</p><div><button data-care-mode="wallet">${sl('wallet')} ↗</button><button data-care-mode="premium">${sl('premium')} ↗</button><button data-action="bookings">${t('bookings')}</button><button data-action="app">${sl('app')}</button></div></section><section class="partner-strip">`);};
function careCost(){return careMode==='pharmacy'?careCart.reduce((s,q,i)=>s+q*[180,60,240][i],0)+30:careMode==='video'?300:900;}
function careArea(){return `<label>${sl('area')}<select id="careArea">${['fifth','rehab','outside'].map(a=>`<option value="${a}" ${careChoice.area===a?'selected':''}>${a==='outside'?sl('outside'):areaName(a)}</option>`).join('')}</select></label>`;}
function careDoctor(){return `<div class="care-provider"><img src="${imageAsset('doctor2')}" alt="${t('stock')}"><div><h3>${sl('doctor')}</h3><p>${sl('general')}</p><small>${t('stock')} · ${t('sample')}</small></div></div>`;}
function careSelect(){if(careMode==='pharmacy')return `<section class="panel"><h2>${sl('shop')}</h2><p>${sl('shopInfo')}</p><div class="care-products">${sl('products').map((s,i)=>`<article><span class="product-symbol" aria-hidden="true">${careProductArt(i)}</span><h3>${s}</h3><b>${money([180,60,240][i])}</b><div class="quantity-controls"><button data-care-qty="${i}" data-delta="-1" ${careCart[i]===0?'disabled':''} aria-label="${lang==='ar'?'قلل':'Remove one'} ${s}">−</button><span>${careCart[i]}</span><button data-care-qty="${i}" data-delta="1" aria-label="${sl('add')} ${s}">+</button></div></article>`).join('')}</div><div class="field-grid">${careArea()}<div><b>${sl('basket')}</b><p>${careCart.reduce((a,b)=>a+b,0)} ${lang==='ar'?'منتج في المثال':'items in this example'}</p><small>${sl('delivery')}</small></div></div>${careChoice.area==='outside'?'<p class="error">'+sl('unavailable')+'</p>':''}<div class="note"><b>${sl('rx')}</b><p>${sl('rxText')}</p></div><button class="primary" data-care-next ${careCart.every(q=>!q)||careChoice.area==='outside'?'disabled':''}>${sl('checkout')}</button>${careCart.every(q=>!q)?'<p>'+sl('empty')+'</p>':''}</section>`;
return `<section class="panel">${careDoctor()}<div class="care-example-price"><b>${money(careCost())}</b><small>${sl('fee')}${careMode==='video'?' · '+sl('duration'):''}</small></div><div class="field-grid">${careMode==='home'?careArea():`<div><b>${sl('video')}</b><p>${lang==='ar'?'من خلال اتصال فيديو، مش زيارة عيادة.':'A video appointment, rather than a clinic visit.'}</p></div>`}<label>${sl('who')}<select id="careWho"><option value="self" ${careChoice.who==='self'?'selected':''}>${sl('self')}</option><option value="family" ${careChoice.who==='family'?'selected':''}>${sl('family')}</option></select></label></div><p class="care-field-label">${sl('day')}</p><div class="calendar">${[0,1,2].map(i=>`<button data-care-day="${i}" class="${careChoice.day===i?'selected':''}">${dayName(i)}</button>`).join('')}</div><div class="slots">${times(careChoice.day).map(s=>`<button data-care-time="${s}" class="${careChoice.time===s?'selected':''}">${s}</button>`).join('')}</div>${careMode==='home'?'<div class="note"><b>'+sl('homeAddress')+'</b><p>'+sl('homeAddressText')+'</p></div>':''}${careChoice.area==='outside'&&careMode==='home'?'<p class="error">'+sl('unavailable')+'</p>':''}<button class="primary" data-care-next ${careMode==='home'&&careChoice.area==='outside'?'disabled':''}>${sl(careMode==='video'?'book':'visit')}</button></section>`;}
function careSummary(){return `<div class="summary-row"><small>${lang==='ar'?'الخدمة':'Service'}</small><b>${sl(careMode)}</b></div>${careMode==='pharmacy'?careCart.map((q,i)=>q?'<div class="summary-row"><span>'+sl('products')[i]+' × '+q+'</span><b>'+money(q*[180,60,240][i])+'</b></div>':'').join(''):careDoctor()}${careMode!=='pharmacy'?'<div class="summary-row"><small>'+sl('who')+'</small><b>'+sl(careChoice.who==='family'?'family':'self')+'</b></div>':''}<div class="summary-row"><small>${careMode==='pharmacy'?sl('area'):t('appointment')}</small><b>${careMode==='pharmacy'?areaName(careChoice.area):dayName(careChoice.day)+' · '+careChoice.time}</b></div>${careMode==='home'?'<div class="summary-row"><small>'+sl('area')+'</small><b>'+areaName(careChoice.area)+'</b></div>':''}<div class="summary-row total"><span>${sl('fee')}</span><b>${money(careCost())}</b></div>${careMode==='pharmacy'?'<small>'+sl('delivery')+'</small>':''}`;}
function careReview(){return `<form id="careReviewForm" class="panel"><h2>${sl('next')}</h2>${careSummary()}<div class="note">${sl('paymentNote')}</div><label class="consent"><input id="careConsent" type="checkbox" required><span>${sl('consent')}</span></label><div class="confirm-actions"><button type="button" data-care-back>${sl('edit')}</button><button class="primary" type="submit">${sl('confirm')}</button></div></form>`;}
function waitingRoom(){return `<section class="demo-video-room"><small>${sl('roomTitle')}</small><div class="video-room-status">${sl('roomTitle')}</div><div class="video-placeholder"><div class="video-self-preview" aria-hidden="true">${careIcon('user')}</div><img class="video-doctor-portrait" src="${imageAsset('doctor2')}" alt="${t('stock')}"><h3>${sl('doctor')}</h3><p>${sl('roomBody')}</p></div><div class="video-controls"><button data-room-control="mic" aria-pressed="${demoMic}">${careIcon('mic')}${sl('mic')}: ${sl(demoMic?'on':'off')}</button><button data-room-control="camera" aria-pressed="${demoCamera}">${careIcon('camera')}${sl('camera')}: ${sl(demoCamera?'on':'off')}</button></div><button data-action="help">${sl('reconnect')}</button></section>`;}
function careDone(){return `<section class="panel"><div class="check-circle">✓</div><h2>${sl('done')}</h2><p>${sl('noReal')}</p>${careSummary()}<div class="note">${sl(careMode==='video'?'videoAfter':careMode==='home'?'homeAfter':'deliveryAfter')}</div><div class="confirm-actions">${careMode==='video'?'<button class="primary" data-room-open>'+sl('room')+'</button>':''}<button data-action="help">${sl('support')}</button><button data-action="app">${sl('app')}</button><button data-care-restart>${sl('edit')}</button></div>${demoRoom&&careMode==='video'?waitingRoom():''}</section>`;}
function servicePage(){if(careMode==='activity')return '<button class="back" data-care-mode="root">'+sl('back')+'</button><div class="page-title"><h2>'+t('bookings')+'</h2><p>'+sl('demo')+'</p></div>'+careHistory.map((item,i)=>'<section class="panel"><div class="summary-row"><b>'+sl(item.mode)+'</b><small>CD-DEMO-'+(i+1)+'</small></div><p>'+(item.mode==='pharmacy'?sl('basket'):dayName(item.choice.day)+' · '+item.choice.time)+'</p><div class="summary-row"><small>'+sl('fee')+'</small><b>'+money(item.cost)+'</b></div><button class="primary" data-care-history="'+i+'">'+(lang==='ar'?'شوف التفاصيل':'View details')+'</button><button data-action="help">'+sl('support')+'</button></section>').join('')+(confirmed?'<section class="panel"><h3>'+sl('clinic')+'</h3><button data-clinic-history>'+t('bookings')+'</button></section>':'');if(['wallet','premium'].includes(careMode))return `<button class="back" data-care-mode="root">${sl('back')}</button><section class="service-intro"><span class="care-mode-icon">${serviceIcons[careMode]}</span><h1>${sl(careMode+'Lead')}</h1><p>${sl(careMode+'Text')}</p></section><section class="panel">${careMode==='wallet'?`<div class="wallet-preview"><div class="wallet-art" aria-hidden="true">${careIcon('wallet')}</div><small>${sl('balance')}</small><b>—</b><p>${sl('notConnected')}</p></div><h3>${sl('history')}</h3><div class="summary-row"><span>${sl('payment')}</span><small>${t('sample')}</small></div><div class="summary-row"><span>${sl('refund')}</span><small>${t('sample')}</small></div><div class="note">${sl('walletNote')}</div>`:''}<button class="primary" data-action="app">${sl(careMode==='premium'?'premiumCTA':'app')}</button><button data-action="help">${sl('support')}</button></section>`;
return `<button class="back" data-care-mode="root">${sl('back')}</button><div class="service-page-heading"><div><div class="eyebrow">CASADOCTORS · ${sl(careMode)}</div><h1>${sl(careMode+'Lead')}</h1><p>${sl('demo')}</p></div><span class="service-large-icon" aria-hidden="true">${serviceIcons[careMode]}</span></div><div class="progress">${sl('steps').map((s,i)=>'<span class="'+(careStep===i?'active':'')+'">'+(i+1)+' · '+s+'</span>').join('')}</div><div class="service-workflow"><div>${careStep===0?careSelect():careStep===1?careReview():careDone()}</div><aside class="panel service-guide"><h3>${sl('guide')}</h3><p>${sl(careMode==='video'?'videoScope':careMode==='home'?'homeScope':'shopInfo')}</p><div class="note">${sl(careMode==='video'?'videoPrep':careMode==='home'?'homeInfo':'rxText')}</div><h3>${sl('support')}</h3><p>${sl(careMode==='video'?'videoAfter':careMode==='home'?'homeAfter':'deliveryAfter')}</p><button data-action="help">${sl('support')}</button><button data-action="app">${sl('app')}</button></aside></div>`;}
function openCare(mode){if(mode==='root'){navigate('home');return;}if(mode==='clinic'){navigate('results');return;}careMode=mode;careStep=0;demoRoom=false;careChoice={area:'fifth',day:0,time:'16:30',who:'self'};if(location.hash==='#service/'+mode)render();else navigate('service/'+mode);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.action==='reset'){careHistory.length=0;careCart=[0,0,0];careStep=0;demoRoom=false;demoMic=false;demoCamera=false;}if(b.dataset.action==='bookings'&&careHistory.length){e.stopImmediatePropagation();navigate('service/activity');return;}if(b.dataset.careHistory!==undefined){const item=careHistory[Number(b.dataset.careHistory)];careMode=item.mode;careChoice={...item.choice};careCart=[...item.cart];careStep=2;demoRoom=false;navigate('service/'+careMode);return;}if(b.hasAttribute('data-clinic-history')){chosen=confirmed.doctorId;day=confirmed.day;time=confirmed.time;bookingFor=confirmed.bookingFor;navigate('confirmation');return;}if(b.dataset.careMode)openCare(b.dataset.careMode);if(b.hasAttribute('data-care-next')){careStep=1;render();window.scrollTo(0,0);}if(b.hasAttribute('data-care-back')||b.hasAttribute('data-care-restart')){careStep=0;demoRoom=false;render();}if(b.dataset.careDay!==undefined){careChoice.day=Number(b.dataset.careDay);careChoice.time=times(careChoice.day)[0];render();}if(b.dataset.careTime){careChoice.time=b.dataset.careTime;render();}if(b.dataset.careQty!==undefined){const i=Number(b.dataset.careQty);careCart[i]=Math.min(9,Math.max(0,careCart[i]+Number(b.dataset.delta)));render();}if(b.hasAttribute('data-room-open')){demoRoom=!demoRoom;render();$('.demo-video-room')?.scrollIntoView({behavior:'smooth',block:'center'});}if(b.dataset.roomControl){if(b.dataset.roomControl==='mic')demoMic=!demoMic;else demoCamera=!demoCamera;render();$('.demo-video-room')?.scrollIntoView({block:'center'});}});
document.addEventListener('change',e=>{if(e.target.id==='careArea'){careChoice.area=e.target.value;render();}if(e.target.id==='careWho')careChoice.who=e.target.value;});
document.addEventListener('submit',e=>{if(e.target.id==='careReviewForm'){e.preventDefault();if(!$('#careConsent').checked)return;if(careStep!==1)return;careHistory.push({mode:careMode,choice:{...careChoice},cart:[...careCart],cost:careCost()});careStep=2;render();window.scrollTo(0,0);}});

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.quickDoctor){chosen=Number(b.dataset.quickDoctor);day=Number(b.dataset.quickDay);time=b.dataset.quickTime;navigate('booking/'+chosen);}else if(b.dataset.doctor){chosen=Number(b.dataset.doctor);day=filters.date==='any'?doctor().first:Math.max(doctor().first,searchDateOffset());time='';navigate('doctor/'+chosen);}else if(b.dataset.service){filters.specialty=b.dataset.service;navigate('results');}else if(b.dataset.day){day=Number(b.dataset.day);time='';render();}else if(b.dataset.time){time=b.dataset.time;render();}else if(b.dataset.for){bookingFor=b.dataset.for;render();}else{const a=b.dataset.action;if(a==='app')appModal();if(a==='language'){lang=lang==='ar'?'en':'ar';render();}if(a==='results')navigate('results');if(a==='profile')navigate('doctor/'+chosen);if(a==='review'&&time)navigate('booking/'+chosen);if(a==='help'||a==='partners'||a==='cancel')modal(a);if(a==='close')closeModal();if(a==='cancelYes'){confirmed.cancelled=true;closeModal();render();}if(a==='reschedule'){chosen=confirmed.doctorId;day=confirmed.day;confirmed=null;time='';navigate('doctor/'+chosen);}if(a==='clear'){filters={specialty:'all',area:'all',date:'any',max:'all',sort:'earliest'};render();}if(a==='reset'){filters={specialty:'all',area:'all',date:'any',max:'all',sort:'earliest'};confirmed=null;chosen=1;day=0;time='';bookingFor='self';payment='app';if(stage==='home')render();else navigate('home');}if(a==='bookings'){if(confirmed){chosen=confirmed.doctorId;day=confirmed.day;time=confirmed.time;bookingFor=confirmed.bookingFor;navigate('confirmation');}else{$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">${t('noBookings')}</h3><button data-action="close">×</button></div><p>${t('noBookingsText')}</p><button class="primary" data-action="close">${t('close')}</button></section></div>`;$('#modalRoot button').focus();}}}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();filters.specialty=$('#specialty').value;filters.area=$('#area').value;filters.date=$('#date').value||'any';if(stage==='results')render();else navigate('results');}if(e.target.id==='bookingForm'){e.preventDefault();if(!$('#consent').checked){$('#bookingError').textContent=t('consentError');return;}payment=$('input[name="payment"]:checked').value;confirmed={payment,cancelled:false,doctorId:chosen,day,time,bookingFor};$('#demoName').value='';$('#demoContact').value='';navigate('confirmation');}});
document.addEventListener('click',e=>{if(e.target.id==='date'){try{e.target.showPicker?.();}catch{}}});
document.addEventListener('change',e=>{if(e.target.id==='maxFee'){filters.max=e.target.value;render();}if(e.target.id==='sort'){filters.sort=e.target.value;render();}if(e.target.name==='payment')payment=e.target.value;});
document.addEventListener('keydown',e=>{if(!$('#modalRoot').firstChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const bs=[...$('#modalRoot').querySelectorAll('button,a[href]')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}});
window.addEventListener('hashchange',route);route();let popupDismissed=false;try{popupDismissed=sessionStorage.getItem('casa-app-popup-shown')==='1'}catch(e){}function scheduleAppPopup(){setTimeout(()=>{if(popupDismissed)return;if(stage!=='home'||($('#searchDateCalendar')&&!$('#searchDateCalendar').hidden)||$('#modalRoot').firstChild||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){scheduleAppPopup();return;}popupDismissed=true;appModal();},8000)}if(!popupDismissed)scheduleAppPopup();
</script><script type="module" src="immersive-home.js?v=6"></script></body></html>
