const t=k=>words[lang][k]||k,n=d=>d.name[lang==='ar'?0:1],areaName=a=>a==='fifth'?(lang==='ar'?'التجمع الخامس':'Fifth Settlement'):(lang==='ar'?'الرحاب':'Al Rehab'),money=v=>v.toLocaleString(lang==='ar'?'ar-EG':'en-GB')+' '+t('egp'),dayName=i=>t(['today','tomorrow','after'][i]),doctor=()=>doctors.find(d=>d.id===chosen)||doctors[0],times=i=>i===0?['16:30','18:00','19:30']:i===1?['11:00','14:30','17:00']:['10:00','13:00','18:30'];
function avatar(d){return `<svg viewBox="0 0 100 115" aria-hidden="true"><rect width="100" height="115" fill="${d.color}"/><circle cx="51" cy="40" r="23" fill="#bb8062"/><path d="M27 40Q20 7 49 9Q80 4 77 42L70 26Q53 35 33 26Z" fill="#2c4545"/>${d.female?'<path d="M26 29Q17 58 31 72L37 48M75 30Q87 53 71 72L67 48" fill="#2c4545"/>':''}<path d="M8 115Q10 71 38 71L51 83L64 71Q91 72 95 115" fill="#f6f5ec"/><path d="M38 72L51 83L64 72L63 115H39Z" fill="#387e79"/><path d="M28 80Q21 101 41 100M73 80Q81 99 60 100" fill="none" stroke="#476663" stroke-width="2"/><circle cx="42" cy="100" r="4" fill="#476663"/></svg>`;}
function heroArt(){return `<svg viewBox="0 0 500 390" role="img" aria-label="${lang==='ar'?'رسم توضيحي للعيلة وخطوة الحجز':'Illustration of family and booking clarity'}"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eff3df"/><stop offset="1" stop-color="#b9d9c6"/></linearGradient></defs><rect width="500" height="390" fill="url(#bg)"/><path d="M305 0V250H465V0" fill="#f7f6e9"/><path d="M322 22H447V232H322Z" fill="#b9d4c5"/><path d="M385 22V232M322 117H447" stroke="#f5f2df" stroke-width="10"/><circle cx="378" cy="77" r="31" fill="#e4d7a5"/><path d="M0 311Q125 269 269 317Q400 281 500 310V390H0" fill="#8ab6a2"/><path d="M95 286Q89 173 155 166Q210 168 213 283" fill="#ebeddd"/><path d="M123 99Q121 60 157 63Q194 63 191 103L179 116H135Z" fill="#293e41"/><ellipse cx="156" cy="113" rx="29" ry="34" fill="#bc8161"/><path d="M126 103Q121 63 156 65Q189 60 187 101Q160 84 126 103" fill="#293e41"/><path d="M110 282L126 183L166 200L181 286" fill="#358480"/><path d="M182 209Q211 238 240 195" stroke="#bc8161" stroke-width="18" fill="none" stroke-linecap="round"/><rect x="229" y="151" width="33" height="53" rx="7" fill="#153e43" transform="rotate(13 240 180)"/><rect x="234" y="159" width="23" height="30" rx="3" fill="#d9eee1"/><path d="M265 285Q263 212 311 213Q357 215 358 286" fill="#d5ac69"/><ellipse cx="307" cy="181" rx="24" ry="29" fill="#c48967"/><path d="M283 183Q272 142 308 144Q339 145 331 185L322 164Q301 177 283 165" fill="#293e41"/><path d="M300 282Q345 258 359 272" stroke="#c48967" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M429 285V230M429 252Q406 211 393 223Q394 247 429 259M429 263Q453 222 466 233Q462 255 429 272" stroke="#437d66" fill="#437d66" stroke-width="4"/><path d="M410 279H449L441 315H418Z" fill="#eef2e5"/><path d="M139 37H222" stroke="#aac4a9" stroke-width="3"/><circle cx="98" cy="62" r="14" fill="#f6f6e7"/></svg>`;}
function searchBox(){return `<form id="searchForm" class="search-box"><div class="search-title"><b>${t('searchTitle')}</b><small>${t('sample')}</small></div><div class="search-grid"><label>${t('specialty')}<select id="specialty"><option value="all">${t('allSpecialties')}</option>${['skin','children','dental'].map(s=>`<option value="${s}" ${filters.specialty===s?'selected':''}>${t(s)}</option>`).join('')}</select></label><label>${t('area')}<select id="area"><option value="all">${t('allAreas')}</option>${['fifth','rehab'].map(a=>`<option value="${a}" ${filters.area===a?'selected':''}>${areaName(a)}</option>`).join('')}</select></label><label>${t('date')}<select id="date">${['any','today','tomorrow','after'].map(s=>`<option value="${s}" ${filters.date===s?'selected':''}>${t(s)}</option>`).join('')}</select></label><button class="primary" type="submit">${t('search')}</button></div></form>`;}
function progress(i){return `<div class="progress" aria-label="${lang==='ar'?'خطوات التجربة':'Journey progress'}">${[t('find'),t('profile'),t('summary'),t('confirmedStatus')].map((s,j)=>`<span ${i===j?'class="active" aria-current="step"':''}>${j+1} · ${s}</span>${j<3?'<i>·</i>':''}`).join('')}</div>`;}
function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${t('eyebrow')}</div><h1>${t('headline')}</h1><p>${t('sub')}</p><div class="hero-labels">${['near','suitable','clear'].map(k=>`<span class="pill">${t(k)}</span>`).join('')}</div></div><div class="hero-art">${heroArt()}<div class="art-card"><b>${t('artTitle')}</b><small>${t('artSub')}</small></div></div></section>${searchBox()}<section class="section"><div class="section-top"><div><h2>${t('services')}</h2><p>${t('servicesSub')}</p></div></div><div class="service-grid">${['skin','children','dental'].map((s,i)=>`<button class="service-tile" data-service="${s}"><span class="tile-icon">${['✧','♡','◇'][i]}</span><span><b>${t(s)}</b><small>${t('serviceDesc')}</small></span></button>`).join('')}</div></section><section class="section"><div class="section-top"><h2>${t('stepsTitle')}</h2></div><div class="journey">${[1,2,3].map(i=>`<div><span class="num">0${i}</span><h3>${t('step'+i)}</h3><p>${t('step'+i+'p')}</p></div>`).join('')}</div></section><section class="partner-strip"><div><h3>${t('partnerHeadline')}</h3><p>${t('partnerSub')}</p></div><button data-action="partners">${t('partnerCTA')}</button></section>`;}
function filtered(){let a=doctors.filter(d=>(filters.specialty==='all'||d.spec===filters.specialty)&&(filters.area==='all'||d.area===filters.area)&&(filters.max==='all'||d.fee<=Number(filters.max))&&(filters.date==='any'||d.first<=['today','tomorrow','after'].indexOf(filters.date)));return a.sort((a,b)=>filters.sort==='nearest'?a.km-b.km:filters.sort==='price'?a.fee-b.fee:a.first-b.first||a.km-b.km);}
function card(d){const preview=filters.date==='any'?d.first:Math.max(d.first,['today','tomorrow','after'].indexOf(filters.date));return `<article class="doctor-card"><div class="doctor-card-top"><div class="portrait">${avatar(d)}</div><div><h3>${n(d)}</h3><p>${t('consultant')} · ${t(d.spec)}</p><div class="rating">★ ${d.rating} · ${t('sampleRating')}</div></div></div><div class="card-details"><div><small>${t('location')}</small><b>${areaName(d.area)}</b><small>${d.km} ${lang==='ar'?'كم — مسافة توضيحية':'km — illustrative distance'}</small></div><div><small>${t('fee')}</small><b>${money(d.fee)}</b><small>${t('fixed')}</small></div></div><div class="slot-preview"><span>${t('next')}</span><b>${dayName(preview)} · ${times(preview)[0]}</b></div><button class="primary" data-doctor="${d.id}">${t('profile')}</button></article>`;}
function results(){const ds=filtered();return `${progress(0)}<div class="page-title"><h2>${t('results')}</h2><p>${t('resultsSub')}</p></div>${searchBox()}<div class="results-layout"><aside class="filter-panel"><h3>${t('filter')}</h3><label>${t('priceLimit')}<select id="maxFee">${['all','500','600','800'].map(v=>`<option value="${v}" ${filters.max===v?'selected':''}>${v==='all'?t('anyPrice'):money(Number(v))}</option>`).join('')}</select></label><div class="note">${t('fixed')}</div></aside><section><div class="result-toolbar"><span>${ds.length} ${t('options')}</span><select id="sort" aria-label="${t('sort')}">${['earliest','nearest','price'].map(k=>`<option value="${k}" ${filters.sort===k?'selected':''}>${t(k)}</option>`).join('')}</select></div>${ds.length?`<div class="doctor-grid">${ds.map(card).join('')}</div>`:`<div class="empty"><h3>${t('empty')}</h3><p>${t('emptyText')}</p><button data-action="clear">${t('clearFilters')}</button></div>`}</section></div>`;}
function profile(){const d=doctor();if(day<d.first)day=d.first;return `${progress(1)}<button class="back" data-action="results">${t('back')}</button><div class="profile-layout"><div><section class="panel"><div class="profile-top"><div class="portrait">${avatar(d)}</div><div><small>${t('sample')}</small><h1>${n(d)}</h1><p>${t('consultant')} · ${t(d.spec)}</p><div class="stats"><span class="pill">${areaName(d.area)}</span><span class="pill">★ ${d.rating} · ${t('sample')}</span></div></div></div></section><section class="panel"><h3>${t('about')}</h3><p>${t('profileAbout')}</p><ul class="details-list"><li>${t('credentials')} · ${t(d.spec)}</li><li>${t('location')}: ${areaName(d.area)} · ${lang==='ar'?'مركز طبي توضيحي':'Illustrative medical centre'}</li></ul></section><section class="panel"><h3>${t('clinic')}</h3><p>${t('access')}</p><div class="note">${t('included')}</div><h3>${t('review')}</h3><p>${t('reviewText')}</p></section></div><aside class="panel sticky"><h3>${t('choose')}</h3><div class="summary-row"><small>${t('fee')}</small><b>${money(d.fee)}</b></div><small>${t('daysLabel')}</small><div class="calendar">${[0,1,2].map(i=>`<button data-day="${i}" ${i<d.first?'disabled':''} class="${day===i?'selected':''}" aria-pressed="${day===i}">${dayName(i)}</button>`).join('')}</div><div class="slots">${times(day).map(s=>`<button data-time="${s}" class="${time===s?'selected':''}" aria-pressed="${time===s}">${s}</button>`).join('')}</div><div class="note">${t('fixed')}</div><button class="primary" style="width:100%" data-action="review" ${!time?'disabled':''}>${t('continue')}</button>${!time?`<p class="error">${t('selectTime')}</p>`:''}</aside></div>`;}
function summary(d){return `<div class="doctor-card-top"><div class="portrait">${avatar(d)}</div><div><h3>${n(d)}</h3><p>${t(d.spec)}</p><small>${t('sample')}</small></div></div><div class="summary-row"><small>${t('location')}</small><b>${areaName(d.area)}</b></div><div class="summary-row"><small>${t('appointment')}</small><b>${dayName(day)} · <bdi>${time}</bdi></b></div><div class="summary-row"><small>${t('fee')}</small><b>${money(d.fee)}</b></div><div class="summary-row"><small>${t('extra')}</small><b>${money(0)}</b></div><div class="summary-row total"><span>${t('total')}</span><span>${money(d.fee)}</span></div>`;}
function booking(){const d=doctor();return `${progress(2)}<div class="page-title"><h2>${t('bookingTitle')}</h2><p>${t('bookingSub')}</p></div><div class="booking-layout"><form id="bookingForm"><section class="panel"><h3>${t('who')}</h3><div class="booking-as"><button type="button" data-for="self" class="${bookingFor==='self'?'selected':''}">${t('self')}</button><button type="button" data-for="family" class="${bookingFor==='family'?'selected':''}">${t('family')}</button></div><div class="field-grid"><label>${t('name')}<input id="demoName" value="${t(bookingFor==='self'?'demoName':'demoFamily')}" autocomplete="off" maxlength="60" required></label><label>${t('contact')}<input id="demoContact" value="01000000000" autocomplete="off" inputmode="tel" maxlength="15" required></label></div><div class="note">${t('bookingSub')}</div></section><section class="panel"><h3>${t('paymentTitle')}</h3>${['app','clinic'].map(v=>`<label class="payment-option"><input type="radio" name="payment" value="${v}" ${payment===v?'checked':''}><span><b>${t(v==='app'?'appPay':'clinicPay')}</b><small>${t(v==='app'?'appPayDesc':'clinicPayDesc')}</small></span></label>`).join('')}<div class="note">${t('policy')}</div><label class="consent"><input type="checkbox" id="consent" required><span>${t('agree')}</span></label><p id="bookingError" class="error" role="alert"></p><button class="primary" style="width:100%;margin-top:22px" type="submit">${t('confirm')}</button></section></form><aside class="panel sticky"><h3>${t('summary')}</h3>${summary(d)}<button class="quiet" style="width:100%;margin-top:20px" data-action="profile">${t('change')}</button></aside></div>`;}
function confirmation(){const d=doctor();return `${progress(3)}<div class="confirmation"><div class="confirm-head"><div class="check-circle">${confirmed.cancelled?'–':'✓'}</div><h2>${confirmed.cancelled?t('cancelled'):t('confirmedTitle')}</h2><p>${t('confirmedSub')}</p></div><section class="panel"><div class="summary-row"><small>${t('ref')}</small><bdi>CD-DEMO-014</bdi></div>${summary(d)}<div class="status-line ${confirmed.cancelled?'cancelled':''}"><span class="status-dot"></span><span>${t('status')}: <b>${t(confirmed.cancelled?'cancelled':'confirmedStatus')}</b></span></div><small>${t(confirmed.payment==='app'?'paid':'payClinicStatus')}</small><div class="note"><b>${t('nextStep')}</b><p>${t('nextStepText')}</p></div><div class="confirm-actions">${!confirmed.cancelled?`<button data-action="reschedule">${t('change')}</button><button data-action="cancel">${t('cancel')}</button>`:''}<button data-action="help">${t('help')}</button><button class="primary" data-action="results">${t('newSearch')}</button></div></section></div>`;}
function navigate(s){location.hash=s;}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title='CasaDoctors · '+(lang==='ar'?'نموذج الموقع التفاعلي':'Interactive website prototype');$('#demoBar').innerHTML=`<span>${t('demo')}</span><a href="./#s11">${t('plan')}</a>`;$('#nav').innerHTML=`<button data-action="results">${t('find')}</button><button data-action="bookings">${t('bookings')}</button><button data-action="help">${t('help')}</button>`;$('#headerActions').innerHTML=`<button class="partner-btn" data-action="partners">${t('partners')}</button><button data-action="language" aria-label="${t('language')}">${t('language')}</button>`;$('#footer').innerHTML=`<span>${t('foot')}</span><button class="quiet" data-action="reset">${t('reset')}</button><a href="./#s11">${t('plan')}</a>`;$('#helpFloat').textContent=t('help');$('#app').innerHTML=`<div class="fade">${stage==='home'?home():stage==='results'?results():stage==='doctor'?profile():stage==='booking'?booking():confirmation()}</div>`;}
function route(){const hash=location.hash.slice(1)||'home',parts=hash.split('/');if(parts[0]==='doctor'){chosen=Number(parts[1]);if(!doctors.some(d=>d.id===chosen))chosen=1;stage='doctor';}else if(parts[0]==='booking'&&time)stage='booking';else if(parts[0]==='confirmation'&&confirmed)stage='confirmation';else stage=['home','results'].includes(parts[0])?parts[0]:'home';render();window.scrollTo(0,0);}
function modal(type){let title=type==='cancel'?t('cancelTitle'):t(type==='partners'?'partnerTitle':'helpTitle'),text=type==='cancel'?t('cancelText'):t(type==='partners'?'partnerText':'helpText');$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">${title}</h3><button data-action="close" aria-label="${t('close')}">×</button></div><p>${text}</p>${type==='cancel'?`<button class="primary" data-action="cancelYes">${t('cancelYes')}</button> <button data-action="close">${t('keep')}</button>`:`<button class="primary" data-action="close">${t('close')}</button>`}</section></div>`;$('#modalRoot button').focus();}
function closeModal(){$('#modalRoot').innerHTML='';$('#helpFloat').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.doctor){chosen=Number(b.dataset.doctor);day=filters.date==='any'?doctor().first:Math.max(doctor().first,['today','tomorrow','after'].indexOf(filters.date));time='';navigate('doctor/'+chosen);}else if(b.dataset.service){filters.specialty=b.dataset.service;navigate('results');}else if(b.dataset.day){day=Number(b.dataset.day);time='';render();}else if(b.dataset.time){time=b.dataset.time;render();}else if(b.dataset.for){bookingFor=b.dataset.for;render();}else{const a=b.dataset.action;if(a==='language'){lang=lang==='ar'?'en':'ar';render();}if(a==='results')navigate('results');if(a==='profile')navigate('doctor/'+chosen);if(a==='review'&&time)navigate('booking/'+chosen);if(a==='help'||a==='partners'||a==='cancel')modal(a);if(a==='close')closeModal();if(a==='cancelYes'){confirmed.cancelled=true;closeModal();render();}if(a==='reschedule'){chosen=confirmed.doctorId;day=confirmed.day;confirmed=null;time='';navigate('doctor/'+chosen);}if(a==='clear'){filters={specialty:'all',area:'all',date:'any',max:'all',sort:'earliest'};render();}if(a==='reset'){filters={specialty:'all',area:'all',date:'any',max:'all',sort:'earliest'};confirmed=null;chosen=1;day=0;time='';bookingFor='self';payment='app';if(stage==='home')render();else navigate('home');}if(a==='bookings'){if(confirmed){chosen=confirmed.doctorId;day=confirmed.day;time=confirmed.time;navigate('confirmation');}else{$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">${t('noBookings')}</h3><button data-action="close">×</button></div><p>${t('noBookingsText')}</p><button class="primary" data-action="close">${t('close')}</button></section></div>`;$('#modalRoot button').focus();}}}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();filters.specialty=$('#specialty').value;filters.area=$('#area').value;filters.date=$('#date').value;if(stage==='results')render();else navigate('results');}if(e.target.id==='bookingForm'){e.preventDefault();if(!$('#consent').checked){$('#bookingError').textContent=t('consentError');return;}payment=$('input[name="payment"]:checked').value;confirmed={payment,cancelled:false,doctorId:chosen,day,time};$('#demoName').value='';$('#demoContact').value='';navigate('confirmation');}});
document.addEventListener('change',e=>{if(e.target.id==='maxFee'){filters.max=e.target.value;render();}if(e.target.id==='sort'){filters.sort=e.target.value;render();}if(e.target.name==='payment')payment=e.target.value;});
document.addEventListener('keydown',e=>{if(!$('#modalRoot').firstChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const bs=[...$('#modalRoot').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}});
window.addEventListener('hashchange',route);route();
</script></body></html>
